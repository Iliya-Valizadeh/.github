name: Idea
description: Suggest a change, a new feature or a better way to measure something.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is missing or hard today? Who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: What would you change? A rough sketch is fine.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: How we would know it helps
      description: A test, a metric or a before-and-after example, if you have one in mind.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue has no personal financial data, secrets or API keys.
          required: true
